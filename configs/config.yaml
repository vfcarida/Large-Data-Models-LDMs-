# =============================================================================
# DEFAULT CONFIGURATION (PRODUCTION / GPU)
# =============================================================================
# Production-scale MMTT Transformer + DCNv2 configuration for full pre-training
# and supervised fraud/risk fine-tuning.
# =============================================================================
_config_name: "default"

# -----------------------------------------------------------------------------
# Data & Synthetic Prior Generation
# -----------------------------------------------------------------------------
data_path: "data/synthetic_transactions.parquet"
num_users: 2500              # Total distinct customer accounts
min_transactions: 30
max_transactions: 300
fraud_rate: 0.02             # Realistic imbalanced fraud prevalence (2.0%)
batch_size: 64
max_seq_len: 256
num_workers: 0               # Cross-platform deterministic DataLoader execution
use_cudf: false

# -----------------------------------------------------------------------------
# Model Architecture (MMTT Transformer + Periodic Numerical + DCNv2)
# -----------------------------------------------------------------------------
vocab_size: 20               # Automatically synchronized with LDMDataModule
hidden_size: 128             # Transformer hidden dimension (d_model)
num_layers: 4                # Pre-Norm Transformer encoder depth
num_heads: 4                 # Multi-head self-attention heads
dropout: 0.1
tabular_feature_size: 3      # Credit bureau score, annual income, age
dcn_layers: 3                # DCNv2 polynomial cross depth (degree = 4)
use_virtual_tokens: true
num_virtual_tokens: 2
pooling: "mean"

# -----------------------------------------------------------------------------
# Phase 1: Self-Supervised Pre-Training (LimiX + PRAGMA + CoLES)
# -----------------------------------------------------------------------------
pretrain_epochs: 10
pretrain_lr: 0.001           # Peak learning rate for AdamW
ssl_masking_prob: 0.20       # Base masking probability for heterogeneous schedule
ssl_temperature: 0.15        # CoLES contrastive temperature

# -----------------------------------------------------------------------------
# Phase 2: Supervised Fine-Tuning (Fraud Classification)
# -----------------------------------------------------------------------------
finetune_epochs: 15
finetune_lr: 0.001           # Head learning rate (encoder uses 0.25x differential LR)
pos_weight: 8.0              # Positive class weight for imbalanced BCEWithLogitsLoss
metric_threshold: 0.5        # Operating probability threshold for F1/Precision/Recall

# -----------------------------------------------------------------------------
# Evaluation & Governance (SR 11-7 / Gartner AI TRiSM)
# -----------------------------------------------------------------------------
conformal_alpha: 0.10        # Conformal risk abstention miscoverage tolerance
enable_strategic_shift: true # Run Gaussian drift and FGSM adversarial stress tests
noise_std: 0.10
adversarial_epsilon: 0.05

# -----------------------------------------------------------------------------
# Optimizer & Reproducibility
# -----------------------------------------------------------------------------
weight_decay: 0.01
warmup_steps: 50
seed: 42
