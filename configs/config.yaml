defaults:
  - _self_

data:
  batch_size: 1024
  num_workers: 8
  max_seq_len: 256
  use_cudf: true

model:
  hidden_size: 768
  num_heads: 12
  num_layers: 12
  dropout: 0.1
  fusion_type: "dcnv2"
  cross_layers: 3

training:
  max_epochs: 100
  learning_rate: 1e-4
  weight_decay: 0.01
  # SSL Masking configuration based on LimiX (Masked Joint-Distribution)
  ssl_masking_prob: 0.15

evaluation:
  metric_threshold: 0.5
  enable_strategic_shift: false
  
benchmarks:
  # Datasets used for formal testing
  datasets:
    - "V4FinBench"         # Corporate bankruptcy forecasting (extreme imbalance)
    - "OpenML-CC18"        # Zero-shot general tabular classification
    - "TabArena"           # Few-shot general tabular tasks
    - "TALENT-REG"         # Inference quality and tabular interpretability
    - "Adult"              # Adversarial evasion / strategic manipulation simulation
    - "BankMarketing"      # Adversarial evasion
