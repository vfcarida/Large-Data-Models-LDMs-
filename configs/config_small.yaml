# =============================================================================
# SMALL CONFIGURATION (CPU / FAST VERIFICATION)
# =============================================================================
# Compact MMTT + DCNv2 configuration designed to execute end-to-end on CPU in
# under 60 seconds for deterministic verification and CI benchmarking.
# =============================================================================
_config_name: "small"

# -----------------------------------------------------------------------------
# Data & Synthetic Prior Generation
# -----------------------------------------------------------------------------
data_path: "data/synthetic_small.parquet"
num_users: 400               # 400 users (280 train / 60 val / 60 test) for fast CPU verification
min_transactions: 12
max_transactions: 50
fraud_rate: 0.12             # 12% positive rate ensures ~7 fraud users per validation/test split
batch_size: 16
max_seq_len: 64
num_workers: 0               # Zero multiprocessing overhead on Windows/CI
use_cudf: false

# -----------------------------------------------------------------------------
# Model Architecture (MMTT Transformer + Periodic Numerical + DCNv2)
# -----------------------------------------------------------------------------
vocab_size: 20
hidden_size: 64
num_layers: 2
num_heads: 2
dropout: 0.1
tabular_feature_size: 3
dcn_layers: 2
use_virtual_tokens: true
num_virtual_tokens: 2
pooling: "mean"

# -----------------------------------------------------------------------------
# Phase 1: Self-Supervised Pre-Training (LimiX + PRAGMA + CoLES)
# -----------------------------------------------------------------------------
pretrain_epochs: 3
pretrain_lr: 0.001
ssl_masking_prob: 0.15
ssl_temperature: 0.15

# -----------------------------------------------------------------------------
# Phase 2: Supervised Fine-Tuning (Fraud Classification)
# -----------------------------------------------------------------------------
finetune_epochs: 8
finetune_lr: 0.002
pos_weight: 4.0
metric_threshold: 0.5

# -----------------------------------------------------------------------------
# Evaluation & Governance (SR 11-7 / Gartner AI TRiSM)
# -----------------------------------------------------------------------------
conformal_alpha: 0.10
enable_strategic_shift: true
noise_std: 0.10
adversarial_epsilon: 0.05

# -----------------------------------------------------------------------------
# Optimizer & Reproducibility
# -----------------------------------------------------------------------------
weight_decay: 0.01
warmup_steps: 10
seed: 42
